# 「Computer Networks: A Systems Approach」 번역 용어집입니다.
# 번역어에는 괄호 원어를 넣지 않습니다. 원문이 약어를 괄호로 덧붙인 곳의 병기와
# 처음 나오는 곳의 원어 병기는 note로 안내합니다. 프로젝트 용어 기준은 terms.toml에
# 따로 쌓입니다(yeokja terms build).

[terms."packet"]
translation = "패킷"

[terms."switch"]
translation = "스위치"

[terms."router"]
translation = "라우터"

[terms."link"]
translation = "링크"

[terms."host"]
translation = "호스트"

[terms."protocol"]
translation = "프로토콜"

[terms."datacenter"]
translation = "데이터센터"
note = "원문의 datacenter와 data center를 모두 붙여 쓴 데이터센터로 통일합니다."

[terms."data center"]
translation = "데이터센터"
note = "datacenter와 같은 말입니다."

[terms."bandwidth"]
translation = "대역폭"

[terms."latency"]
translation = "지연 시간"
note = "'지연'만 쓰지 않습니다. delay는 문맥에 따라 '지연'으로 옮깁니다."

[terms."round-trip time"]
translation = "왕복 시간"
note = "원문이 (RTT)를 붙인 곳에서는 '왕복 시간(RTT)'으로, RTT만 쓴 곳은 RTT로 둡니다."

[terms."throughput"]
translation = "처리량"

[terms."congestion control"]
translation = "혼잡 제어"

[terms."flow control"]
translation = "흐름 제어"

[terms."forwarding table"]
translation = "포워딩 테이블"

[terms."routing"]
translation = "라우팅"
# 장 번호 치환 참조 |Routing|은 낱말이 아니라 치환 이름입니다.
except = ["|Routing|"]

[terms."best-effort"]
translation = "최선형"
note = "처음 나올 때 '최선형(best-effort)'처럼 원어를 함께 적습니다."

[terms."statistical multiplexing"]
translation = "통계적 다중화"

[terms."sliding window"]
translation = "슬라이딩 윈도"
note = "'윈도우'가 아니라 '윈도'로 적습니다."

[terms."encapsulation"]
translation = "캡슐화"

[terms."end-to-end"]
translation = "종단 간"

[terms."network address translation"]
translation = "네트워크 주소 변환"
note = "원문이 (NAT)를 붙인 곳에서는 '네트워크 주소 변환(NAT)'으로, NAT만 쓴 곳은 NAT로 둡니다."

[terms."Chapter"]
translation = "장"
note = "'Chapter 3'은 '3장'으로 옮깁니다. 장 번호 치환(|Intro|)도 같은 어순입니다."

[terms."Section"]
translation = "절"
note = "'Section 3.2'는 '3.2절'로 옮깁니다."

[terms."Further Reading"]
translation = "더 읽을거리"
