# 한국어판 Quarto 설정. 원문 _quarto.yml을 통째로 대신하므로(오버레이는 병합이 아니라
# 교체) 원문 항목 중 쓰는 것을 다시 적습니다. 원문의 include-in-header·include-after-body
# (리더 셸·오디오북 플레이어·따라 읽기·오프라인 PWA·읽기 기록 스크립트)는 사이트가 도메인
# 루트에 있다고 가정해 /learninpublic/ 하위 경로에서 동작하지 않으므로 두지 않습니다.
# EPUB·PDF는 만들지 않습니다.
project:
  type: book
  output-dir: _book
  resources:
    - apple-touch-icon.png
    - favicon.ico
    - favicon.svg
    - assets/fonts/**
    - assets/illustrations-magazine/**
    - assets/materials/**
    - LICENSE-CONTENT
    - THIRD-PARTY-NOTICES.md

profile:
  default: web

book:
  title: "코딩 커리어 핸드북"
  subtitle: "코드 뉴비에서 시니어 개발자까지 — 가이드, 원칙, 전략, 전술"
  author: "Shawn Wang (swyx)"
  date: "2020-07-01"
  site-url: "https://yeokja.moreal.dev/learninpublic/"
  description: >-
    뛰어난 커리어를 쌓으려는 소프트웨어 개발자를 위한 실용적인 커리어 가이드, 원칙,
    전략, 전술. The Coding Career Handbook의 비공식 한국어 번역.
  output-file: "the-coding-career-handbook"
  page-navigation: true
  search:
    location: sidebar
    type: overlay
    keyboard-shortcut: []
    copy-button: true
    show-item-context: parent
  page-footer:
    left: >-
      [*The Coding Career Handbook*](https://learninpublic.org/) by Shawn Wang (swyx),
      licensed [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/).
      이 사이트는 원문을 한국어로 옮긴 비공식 기계 번역이며 저자의 공식 번역이 아닙니다.
      권리가 확인되지 않은 일부 그림과 원문 사이트의 JavaScript 기능(오디오북 플레이어,
      읽기 기록)은 뺐습니다.
    right: >-
      [원문](https://learninpublic.org/) ·
      [원문 저장소](https://forge.smol.ai/swyx/codingcareer) ·
      [번역 저장소](https://github.com/yeokja/yeokja) ·
      [제3자 저작물 고지](https://yeokja.moreal.dev/learninpublic/THIRD-PARTY-NOTICES.md)
lang: ko-KR
language:
  search-text-placeholder: "장과 아이디어 검색…"
metadata:
  version: "1.3.0"
  identifier: "urn:uuid:a0c47cde-4d2a-4865-96ef-e78cd816cf88"
  rights: "Copyright © 2020–2026 Shawn Wang. Licensed CC BY 4.0 except where otherwise noted. 한국어 번역: yeokja (CC BY 4.0)."

format:
  html:
    open-graph: true
    twitter-card: false
    theme:
      light: [cosmo, styles/book.scss, styles/magazine.scss, styles/korean.scss]
      dark: [darkly, styles/book.scss, styles/magazine.scss, styles/korean.scss]
    respect-user-color-scheme: true
    include-after-body:
      - assets/ko/page-classes.html
    canonical-url: true
    toc: true
    toc-title: "이 페이지에서"
    number-sections: true
    link-external-newwindow: false
