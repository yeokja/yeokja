<script>
// 원문의 리더 셸(magazine-shell.js)이 location.pathname 전체를 보고 붙이던 쪽 클래스를
// 경로의 마지막 조각만 보고 붙입니다. 홈·퀵스타트 레이아웃(magazine.scss)이 이 클래스에
// 기대며, 하위 경로(/learninpublic/)에서도 맞습니다.
(() => {
  const segments = window.location.pathname.split("/").filter(Boolean);
  const last = segments[segments.length - 1] || "";
  const isPage = last.endsWith(".html");
  const leaf = isPage ? last.slice(0, -5) : "index";
  const dir = isPage ? segments[segments.length - 2] || "" : last;
  const chapter = dir === "chapters";
  document.body.classList.toggle("book-home", leaf === "index" && !chapter);
  document.body.classList.toggle("book-quickstart-page", leaf === "quickstart" && !chapter);
  document.body.classList.toggle("book-chapter-page", chapter);
})();
</script>
