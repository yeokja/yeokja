# 원칙: 책이 고유명사처럼 반복해 쓰는 원칙·전략·개념 이름을 고정합니다. 검사는 번역문에
# 번역어가 부분 문자열로 들어 있는지만 보므로, 동사로도 쓰이는 표어("you Learn in
# Public", "Open Source your Knowledge")는 활용형(배우기·배우는·배웁니다)이 모두 걸리도록
# 어간까지만 적습니다. 일상어와 겹치는 짧은 단어(tactics, strategy, principle, career,
# senior)는 오탐 재시도를 피하려고 두지 않고 terms.toml에 맡깁니다.

