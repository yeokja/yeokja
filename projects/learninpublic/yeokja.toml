[project]
source_lang = "en"
target_lang = "ko"
glossary = "glossary.toml"
state_dir = "state"

# Quarto book의 장 49개(chapters/)와 루트 문서 4개(index, quickstart, audiobook,
# reading-trail). 소매판 전용 publishing/은 뺍니다. 각 장의 요약(summary.sentence·
# paragraph)은 YAML 앵커로 description·소셜 메타가 가리키므로 중첩 키로 번역합니다.
[[sources]]
path = "upstream"
pattern = "**/*.qmd"
exclude = ["publishing/**"]
parser = "rmarkdown"
output = "ko/{path}"
inline_tags = true
front_matter_keys = ["summary.sentence", "summary.paragraph"]

[derive]
base = "upstream"

[[derive.overlay]]
path = "ko"
require_base = true

# 한국어 _quarto.yml·_quarto-web.yml(원문 파일을 통째로 대신함), 한글 SCSS, 쪽 클래스 스크립트
[[derive.overlay]]
path = "overlay"

# 권리 미확인 그림을 원문 링크 안내로 바꾸고 파일을 지우며, 표지·오디오북 목록·읽기 기록
# 안내를 정적으로 만듭니다(설계 3절).
[[derive.step]]
kind = "generate"
command = 'python3 "$YEOKJA_ROOT/scripts/prepare_site.py" .'

# 번역된 부 제목·장 제목·요약으로 책 지도(assets/generated/book-map.html)를 다시 만듭니다.
[[derive.step]]
kind = "generate"
command = 'python3 "$YEOKJA_ROOT/scripts/book_map.py" .'

# magazine.scss의 글꼴 url(/assets/fonts/…)을 컴파일된 CSS 기준 상대 경로로.
[[derive.step]]
kind = "patch"
file = "patches/magazine-fonts.patch"

# 조립 트리에서 웹 프로필만 HTML로 렌더링하고, 같은 Quarto로 영어 원문을 함께 빌드해
# scripts/check.py로 쪽 목록·제목 수·앵커·링크·제외 그림·미번역 문단을 비교합니다.
[build.html]
command = '''
set -e
rm -rf _book
quarto render --profile web --to html
cp LICENSE-CONTENT THIRD-PARTY-NOTICES.md _book/
rm -rf "$YEOKJA_ROOT/build/original-source" "$YEOKJA_ROOT/build/original"
cp -RL "$YEOKJA_ROOT/upstream" "$YEOKJA_ROOT/build/original-source"
rm -rf "$YEOKJA_ROOT/build/original-source/.git"
(cd "$YEOKJA_ROOT/build/original-source" && quarto render --profile web --to html)
mv "$YEOKJA_ROOT/build/original-source/_book" "$YEOKJA_ROOT/build/original"
python3 "$YEOKJA_ROOT/scripts/check.py" "$YEOKJA_ROOT/build/original" _book
rm -rf site
mv _book site
'''
outputs = ["site"]

[provider]
type = "claude_code"
model = "claude-opus-5-5"

[evaluation]
auto_evaluate = true
style_evaluate = false
max_retries = 3

[translation]
concurrency = 6
