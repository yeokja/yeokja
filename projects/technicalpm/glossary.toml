# Technical Project Management in Living and Geometric Order 용어집
#
# 원칙: 책의 중심 개념(living order, geometric order)은 한국어로 옮기고 첫 등장에만
# 모델이 원어를 괄호로 덧붙입니다. 프로젝트 관리 일반 용어는 PMBOK 지침서
# 한국어판의 관례를 따르고, 약어(WBS, EVM, CPM, PERT, RACI)와 사람 이름,
# 서지 사항의 기관명은 영문으로 둡니다. 널리 알려진 기업명과 방법론 이름
# (도요타, 보잉, 스크럼)은 한국어 관용 표기를 따릅니다(terms.toml). 일상어와 겹치는 짧은 단어(scope, risk, value,
# cost)와 기관명에 그대로 남는 단어(Lean, Agile)는 오탐을 피하려고 여기에
# 두지 않고 terms.toml에 맡깁니다.

[terms."living order"]
translation = "살아 있는 질서"
note = "책의 중심 개념. 불확실성 속에서 적응하며 일하는 방식"

[terms."geometric order"]
translation = "기하학적 질서"
note = "책의 중심 개념. 예측 가능하고 계획 중심으로 일하는 방식"

[terms."work breakdown structure"]
translation = "작업분류체계"
note = "약어 WBS는 그대로 둠"

[terms.stakeholder]
translation = "이해관계자"

[terms."critical path"]
translation = "주경로"

[terms."earned value"]
translation = "획득가치"

[terms."risk register"]
translation = "리스크 관리대장"

[terms."project charter"]
translation = "프로젝트 헌장"

[terms."project sponsor"]
translation = "프로젝트 스폰서"

[terms."PMBOK"]
translation = "PMBOK"

[terms."Project Management Institute"]
translation = "PMI(Project Management Institute)"
