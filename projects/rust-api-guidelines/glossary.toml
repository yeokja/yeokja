# Rust API 가이드라인 용어집
#
# 번역어는 rustc-dev-guide·rust-forge 용어집과 맞춥니다(크레이트, 트레이트,
# 라이프타임, 빌림, 표준 라이브러리 등). 언어·도구·서비스 이름(Rust, Cargo,
# rustdoc, crates.io, Serde, Clippy)과 Rust 고유 관용구 이름(newtype, unsafe)은
# 원문 그대로 둡니다. 가이드라인 식별자(`C-CASE` 등)와 코드 식별자(`Deref`,
# `as_`, `into_iter` 등)는 용어집 대상이 아니며 인라인 코드 그대로 둡니다.

[terms."Rust"]
translation = "Rust"
note = "언어 이름, \"러스트\"로 음차하지 않음"

[terms."Cargo"]
translation = "Cargo"
note = "패키지 관리자 이름, 번역하지 않음"

[terms."crates.io"]
translation = "crates.io"
note = "크레이트 레지스트리 서비스 이름, 번역하지 않음"

[terms."rustdoc"]
translation = "rustdoc"
note = "문서 생성 도구 이름, 번역하지 않음"

[terms."Serde"]
