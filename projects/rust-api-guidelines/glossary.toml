note = "직렬화 프레임워크 이름, 번역하지 않음"

[terms."Clippy"]
translation = "Clippy"
note = "린트 도구 이름, 번역하지 않음"

[terms."standard library"]
translation = "표준 라이브러리"

[terms."crate"]
translation = "크레이트"

[terms."trait"]
translation = "트레이트"

[terms."trait object"]
translation = "트레이트 객체"

[terms."lifetime"]
