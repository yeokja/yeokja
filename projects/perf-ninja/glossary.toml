# Performance Ninja 용어집
#
# 성능 분석 용어는 국내 CPU 성능·컴파일러 문헌의 관용 표기를 따릅니다.
# Top-down 분석(TMA)의 범주 이름(Core Bound, Memory Bound, Bad Speculation,
# Frontend Bound, Backend Bound, Retiring)은 perf·VTune·toplev 출력에 그대로
# 나오는 지표 이름이므로 원문 그대로 둡니다. 약어(SIMD, AVX, TLB, CMOV, LTO,
# PGO, IPC)와 도구 이름(perf, VTune, Google Benchmark)도 원문 그대로 둡니다.

[terms."lab assignment"]
translation = "실습 과제"

[terms."lab"]
translation = "실습"
note = "이 강좌의 실습 과제 하나. 디렉터리 이름(labs/)과 코드 스팬은 그대로 둠"

[terms."Core Bound"]
translation = "Core Bound"
note = "TMA 범주 이름, 번역하지 않음"

[terms."Memory Bound"]
translation = "Memory Bound"
note = "TMA 범주 이름, 번역하지 않음"

[terms."Bad Speculation"]
translation = "Bad Speculation"
note = "TMA 범주 이름, 번역하지 않음"

