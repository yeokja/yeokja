# Write You a Haskell 용어집
#
# 원칙: 컴파일러·타입 이론의 일반 개념은 한국어 관례 번역어로 옮기고, 언어·IR·
# 도구의 고유명사(Fun, Core, ANF, Flat, LLVM, Prelude, Haskell)는 영문으로 둡니다.
# 영문 병기는 한 장에서 처음 나올 때 모델이 괄호로 덧붙이는 것을 허용하되
# 용어집 번역어 자체에는 넣지 않습니다. 일상어와 겹치는 짧은 단어(kind, record,
# root, environment, layout)는 오탐을 피하려고 용어집에 두지 않고 prompt와
# terms.toml에 맡깁니다.

