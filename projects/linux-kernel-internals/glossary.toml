# Linux Kernel Internals 용어집
# 커널 식별자(함수·구조체·sysctl·Kconfig 이름), 사람 이름, 커밋 제목은 원문 그대로 둔다.
# 용어 검사는 낱말 단위로 맞추므로 복수형을 따로 둔다.
# 번역어가 원어와 같은 항목은 음차하지 않고 원어로 쓴다는 뜻이다.
# lock, swap, slab, kernel처럼 동사·복합어로도 흔히 쓰이는 짧은 단어는 두지 않는다
# (포함 검사가 오탐 재시도를 부른다). 반복되는 표현은 terms.toml이 맡는다.
# except는 원문 그대로 두는 커밋·글·책의 제목이다. 그 안의 용어는 번역어를 요구하지 않는다.
