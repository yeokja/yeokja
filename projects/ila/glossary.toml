# Interactive Linear Algebra 용어집
#
# 원칙: 대한수학회 수학용어와 국내 선형대수 교재의 관례를 따르고, 일차/선형은
# 교재 관례대로 "연립일차방정식·일차결합·일차독립"과 "선형변환"을 함께 씁니다.
# 수식(<m>)은 원자로 전송되지만 용어 검사는 수식 바이트까지 읽으므로, 수식 안
# 매크로 이름과 겹치는 단어(\Span, \rank, \Nul, \Col)와 일상어와 겹치는 단어
# (onto, inverse, consistent)는 여기에 두지 않고 terms.toml에 맡깁니다.
# 사람 이름(Gauss, Gram, Schmidt)은 한국어 관용 표기로, 기업·제품명(Google,
# PageRank)은 원문 철자로 둡니다. `except`는 1단계에서 영어로 남는 TikZ 라벨과
# 색인(idx) 속 용례, 그리고 용어가 아닌 일상 표현입니다.

[terms."system of linear equations"]
