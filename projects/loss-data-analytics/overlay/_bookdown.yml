# 한국어판 bookdown 설정. 원문 _bookdown.yml과 같은 rmd_files 순서를 쓰고,
# 산출 디렉터리(원문은 저장소에 커밋된 docs/)와 bookdown이 만드는 UI 문자열만 바꿉니다.
book_filename: "LDAEd2-ko"
output_dir: "_book"
rmd_files: ["index.Rmd", 
           "References/Packages.Rmd",
           "References/Glossary.Rmd",
           "Chapters/Preface.Rmd", 
           "Chapters/Introduction.Rmd", 
           "Chapters/DataAnalytics.Rmd",
           "Chapters/Frequency2024.Rmd",
           "Chapters/LossSeverity2024.Rmd",
           "Chapters/ClaimSeverity2024.Rmd",
           "Chapters/ModelSelection2024.Rmd",
           "Chapters/AggregateLossModels2024.Rmd",
           "Chapters/Simulation2024.Rmd",
           "Chapters/BayesianStatisticsandModeling2024.Rmd",
           "Chapters/PremiumFoundations2024.Rmd",
           "Chapters/RiskClassification2024.Rmd",
           "Chapters/Credibility2024.Rmd",
           "Chapters/PortfolioMgt2024.Rmd",
           "Chapters/LossReserves2024.Rmd",
           "Chapters/ExpRatingBonusMalus2024.Rmd",
           "Chapters/DependenceModels2024.Rmd",
           "Chapters/ReviewStatInference.Rmd",
           "Chapters/IteratedExpectations2024.Rmd",
           "Chapters/MaximumLikeTheory2024.Rmd",
           "Chapters/DistributionTable.Rmd",
           "Chapters/NotationConventions.Rmd",
           "Chapters/DataResources2024.Rmd",
           "Chapters/PdfGlossary.Rmd",
           "Chapters/Bibliography.Rmd"]

language:
  label:
    fig: "그림 "
    tab: "표 "
    eq: "식 "
    thm: "정리 "
    lem: "보조정리 "
    cor: "따름정리 "
    prp: "명제 "
    def: "정의 "
    exm: "예 "
    exr: "연습문제 "
    proof: "증명. "
    remark: "참고. "
    solution: "풀이. "
  ui:
    chapter_name: ["제", "장"]
    appendix_name: "부록 "
    edit: "편집"
    view: "보기"
    history: "기록"
    source: "원본"
    search: "검색"
