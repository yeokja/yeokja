# 한국어판 gitbook 설정. 원문 _output.yml의 gitbook 항목을 바탕으로 목차 머리·꼬리
# 링크를 한국어판에 맞추고, 원문이 bookdown-demo를 가리키던 편집 링크와 공유
# 단추를 뺍니다. PDF·EPUB 출력은 만들지 않습니다. Google Analytics 태그는
# scripts/prepare_book.py가 in_header 파일에서 지웁니다.
bookdown::gitbook:
  css:
    -  Format/style.css
    -  includeWebex/webex.css
    -  Format/ko.css
  includes:
    in_header:
      -  Format/ShowHide2024GSTag.js
      -  includeWebex/webex.js
  split_bib: FALSE
  toc_depth: 3
  config:
    toc:
      collapse: subsection
      before: |
        <li><a href="./">손해 데이터 분석 2판</a></li>
      after: |
        <li><a href="https://github.com/OpenActTexts/LDAVer2" target="blank">원문 저장소(OpenActTexts/LDAVer2)</a></li>
        <li><a href="https://openacttexts.github.io/LDAVer2/" target="blank">영어 원문 웹판</a></li>
    edit: null
    download: null
    sharing: null
    search: yes
