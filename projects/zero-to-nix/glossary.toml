# Zero to Nix 용어집
#
# 제품·프로젝트·조직의 고유명사(Nix, Nixpkgs, NixOS, FlakeHub, Determinate Nix,
# Determinate Systems, nix-installer, Home Manager, Cachix, Hydra, nix-darwin,
# stdenv)는 영어 원문 그대로 둡니다. 한국어 Nix 사용자 커뮤니티와 공식 문서,
# 실제 명령·저장소 이름이 이 표기를 그대로 쓰므로 번역하면 문서와 도구가
# 어긋납니다. 이 규칙은 translation 값을 원문과 동일하게 두는 방식으로
# 표현합니다(yeokja 용어집에는 별도의 "번역하지 않음" 필드가 없습니다).
#
# 명령 이름과 CLI 하위 명령(`nix build`, `nix develop`, `nix run`, `nix search`,
# `nix flake init`, `nixos-rebuild switch`, `nix-shell`, `nix-env` 등), 파일 이름
# (`flake.nix`, `flake.lock`, `configuration.nix`), Nix 언어의 함수·속성 이름
# (`derivation`, `mkShell`, `legacyPackages`, `packages.x86_64-linux`)은 원문의
# 인라인 코드 그대로 두고 절대 번역하지 않습니다. 용어집 매칭은 인라인 코드와
# URL 안을 건너뛰므로, 아래 항목은 산문에 나온 일반 명사에만 적용됩니다.
# 예: "run `nix develop` to enter a development environment"에서 `nix develop`은
# 그대로, "development environment"만 "개발 환경"으로 옮깁니다.
#
# 매칭은 대소문자를 무시하고 단어 경계로 끊으므로 복수형(flakes, derivations)은
# 별도 항목으로 둡니다. 동사 활용형(realising, pinned)도 마찬가지입니다.

# ---- 고유명사: 번역하지 않음 ----

