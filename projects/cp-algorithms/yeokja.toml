[project]
source_lang = "en"
target_lang = "ko"
glossary = "glossary.toml"
state_dir = "state"

[[sources]]
path = "upstream/src"
pattern = "**/*.md"
exclude = ["contrib.md", "code_of_conduct.md", "preview.md"]
parser = "mkdocs"
output = "ko/src/{path}"

[[sources]]
path = "upstream"
pattern = "README.md"
parser = "mkdocs"
output = "ko/src/index_body"

[derive]
base = "upstream"

[[derive.overlay]]
path = "ko"
require_base = true

[provider]
type = "claude_code"
model = "claude-sonnet-5"

[evaluation]
auto_evaluate = true
style_evaluate = false
max_retries = 3

[translation]
concurrency = 8
batch_segments = 32
