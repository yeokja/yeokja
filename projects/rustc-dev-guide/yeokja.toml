[project]
source_lang = "en"
target_lang = "ko"
glossary = "glossary.toml"
state_dir = "state"

[[sources]]
path = "upstream/src"
pattern = "**/*.md"
parser = "markdown"
output = "ko/src/{path}"

[derive]
base = "upstream"

[[derive.overlay]]
path = "ko"
require_base = true

[build.html]
command = '''
set -e
mdbook build "$YEOKJA_ROOT/upstream" --dest-dir "$YEOKJA_ROOT/build/original"
MDBOOK_BOOK__LANGUAGE=ko MDBOOK_BOOK__TITLE='Rust 컴파일러 개발 가이드' mdbook build
python3 "$YEOKJA_ROOT/scripts/preserve_anchors.py" "$YEOKJA_ROOT/build/original/html" book/html
python3 "$YEOKJA_ROOT/scripts/build_print.py" book/html
mv book/html site
cp "$YEOKJA_ROOT/upstream/"LICENSE-* site/
'''
outputs = ["site"]

[provider]
type = "claude_code"
model = "claude-sonnet-5"

[evaluation]
auto_evaluate = true
style_evaluate = false
max_retries = 3

[translation]
concurrency = 8
batch_segments = 32
