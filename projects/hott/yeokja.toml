pattern = "back.tex"
parser = "latex-extended"
output = "ko/{path}"

[[sources]]
path = "upstream"
pattern = "blurb.tex"
parser = "latex-extended"
output = "ko/{path}"

# Canonical subject-index display terms, translated once across all occurrences.
[[sources]]
path = "index"
pattern = "terms.tex"
parser = "latex-extended"
output = "ko-index/{path}"

[derive]
base = "upstream"

[[derive.overlay]]
path = "ko"
require_base = true

[[derive.step]]
kind = "patch"
file = "patches/korean-localization.patch"

[[derive.step]]
kind = "generate"
command = 'python3 "$YEOKJA_ROOT/scripts/prepare_pdf.py"'

[[derive.step]]
kind = "generate"
command = 'python3 "$YEOKJA_ROOT/scripts/index_terms.py" apply'

[build.pdf]
command = '''
set -eu
printf '\\newcommand{\\OPTversion}{%s}\n' "$(git -C "$YEOKJA_ROOT/upstream" rev-parse --short=12 HEAD)-ko" > version.tex
latexmk -xelatex -interaction=nonstopmode -halt-on-error hott-online.tex
if grep -Eq 'Missing character:|There were undefined references|multiply defined' hott-online.log; then
  echo "PDF validation failed: missing glyphs or unresolved references" >&2
  exit 1
fi
cp hott-online.pdf HoTT-ko.pdf
'''
outputs = ["HoTT-ko.pdf"]
dist = "output/pdf"

[provider]
type = "codex"
model = "gpt-6-astra"
reasoning_effort = "medium"

[evaluation]
auto_evaluate = true
style_evaluate = false
max_retries = 3

[translation]
concurrency = 8
batch_segments = 24
