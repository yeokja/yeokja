<ul class="post-list">
  {{ range .posts.ByDate.Reverse }}
  <li>
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006년 1월 2일" }}</time>
    <div class="post-list-copy">
      <h2><a href="{{ .RelPermalink }}">{{ .Title | markdownify }}</a></h2>
      {{ with .Description }}<p>{{ . }}</p>{{ end }}
    </div>
  </li>
  {{ else }}
  <li><p>연구 노트를 준비하고 있습니다.</p></li>
  {{ end }}
</ul>
