# 번역 사이트 설정. upstream/blog/hugo.toml을 대신합니다(scripts/check_upstream.py가
# 원문 설정이 바뀌면 알려 줍니다).
baseURL = "https://yeokja.moreal.dev/forge-lab/"
locale = "ko-kr"
title = "FORGE Lab 비공식 한국어 번역"
hasCJKLanguage = true
disableKinds = ["taxonomy", "term"]
enableRobotsTXT = true

[params]
description = "Microsoft Security의 Frontier Offensive Research & Generative Exploitation(FORGE) Lab이 쓴 연구 노트를 한국어로 옮긴 비공식 번역입니다."
# 쪽마다 번역 고지에서 같은 경로의 원문 쪽으로 잇습니다.
originalURL = "https://forge-blog.github.io/"
originalRepo = "https://github.com/microsoft/forge-lab"
originalLicense = "https://github.com/microsoft/forge-lab/blob/main/LICENSE"

# 원문의 Azure Application Insights 방문 통계를 끕니다. 템플릿에서도 부르지 않습니다.
[params.analytics]
enabled = false

[permalinks]
posts = "/posts/:slug/"
