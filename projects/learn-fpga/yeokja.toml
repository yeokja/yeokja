[project]
source_lang = "en"
target_lang = "ko"
glossary = "glossary.toml"
state_dir = "state"

[[sources]]
path = "upstream"
pattern = "**/*.md"
parser = "markdown"
output = "ko/{path}"

[derive]
base = "upstream"

[[derive.overlay]]
path = "ko"
require_base = true

[build.html]
command = '''
set -e
if ! command -v pandoc >/dev/null 2>&1; then
  if [ "${GITHUB_ACTIONS:-}" = "true" ]; then
    sudo apt-get update
    sudo apt-get install -y pandoc
  else
    echo "HTML 빌드에는 Pandoc이 필요합니다. Pandoc을 설치한 뒤 다시 실행하세요." >&2
    exit 1
  fi
fi
python3 "$YEOKJA_ROOT/scripts/build-site.py"
'''
outputs = ["site"]

[provider]
type = "claude_code"
model = "claude-sonnet-5"

[evaluation]
auto_evaluate = true
style_evaluate = false
max_retries = 3

[translation]
concurrency = 8
batch_segments = 32
