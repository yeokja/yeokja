# Aqueous 아카이브 형식 명세 용어집
#
# 원문은 Bikeshed 명세이며 용어 대부분이 <dfn>으로 정의되고 [=term=]으로
# 링크됩니다. 여기서 정한 번역어는 정의(dfn) 글자와 링크 글자 양쪽에 같이
# 쓰입니다(파서가 바뀐 dfn에 lt="원문"을 붙여 자동 링크를 유지합니다).
# 식별자처럼 생긴 정의(u8, leb128, HEADER_TYPE, block_start, aqr_send …),
# 16진 상수, CDDL, 명령 이름(Nop, Literal, Swap, Slice, Apply, Concat, Pack,
# Split, Patch, Checksum)은 용어집 대상이 아니며 원문 그대로 둡니다.
# 짧은 일상어와 겹치는 낱말(type, size, data, kind, result, root, space …)은
# 오탐으로 재시도를 부르므로 두지 않고 terms.toml에 맡깁니다.
# 원문 저자가 docs/에서 쓰는 한국어(아카이브, 블록, 세그먼트, 체크섬, 재압축,
# 바이트열, 사전, 엔트리, 헤더, 미러, 복구, 평가)를 우선합니다.

[terms."archive"]
translation = "아카이브"

