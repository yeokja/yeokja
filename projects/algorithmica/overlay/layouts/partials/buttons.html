<menu id='menu'>
  <div class='left'>
    <a>
      <img src='/icons/bars-solid.svg'
           onclick='toggleSidebar()'
           title='목차 열기'>
    </a>
    <a>
      <img src='/icons/adjust-solid.svg'
           style='position: relative; top: -1px'
           onclick='switchTheme(localStorage.getItem("theme") == "dark" ? "light" : "dark")'
           title='어두운 테마'>
    </a>
    <a>
      <img src='/icons/search-solid.svg'
           onclick='toggleSearch()'
           title='검색'>
    </a>
  </div>
  <div class='title'>{{.Title}}</div>
  <div class='right'>
    <a onClick='window.print()'>
      <img src='/icons/print-solid.svg' title='인쇄'>
    </a>
    {{ with .Params.originalPath }}
    <a href='{{ $.Site.Params.Repo }}/blob/master/content/russian/{{ . }}' class='github-main'>
      <img src='/icons/github-brands.svg' title='GitHub에서 원문(러시아어) 보기'>
    </a>
    {{ end }}
  </div>
</menu>
