# 한국어 번역 사이트 설정. 원문 config.yaml(영어·러시아어 두 언어, reveal-hugo)을
# 대신합니다. 러시아어판만 번역하므로 한국어 한 언어로 내고, 슬라이드 테마는 쓰지
# 않습니다. Pages의 하위 경로(/algorithmica/)에서 테마의 절대 경로('/icons/…')가
# 동작하도록 canonifyURLs를 켭니다.
baseURL: "https://yeokja.moreal.dev/algorithmica/"
canonifyURLs: true
title: 알고리즘카
theme:
- algorithmica
pygmentsUseClasses: true
outputFormats:
  SearchIndex:
    mediaType: "application/json"
    baseName: "searchindex"
    isPlainText: true
    notAlternative: true
outputs:
  home:
  - HTML
  - SearchIndex
markup:
  goldmark:
    footnote: false  # katex conflict
    renderer:
      unsafe: true
    # Hugo 0.123+의 내장 링크·그림 훅은 원문의 위키식 링크('Категория:Конспект')를
    # URL로 읽다 빌드를 멈춥니다. 원문이 쓰던 Hugo 0.96처럼 훅 없이 그립니다.
    renderHooks:
      link:
        useEmbedded: never
      image:
        useEmbedded: never
defaultContentLanguage: ko
sectionPagesMenu: main
disableKinds: [taxonomy, term, RSS]
languages:
  ko:
    title: 알고리즘카
    contentDir: content/korean
    label: 한국어
    locale: ko-KR
    weight: 1
params:
  repo: "https://github.com/algorithmica-org/algorithmica"
  original: "https://ru.algorithmica.org"
