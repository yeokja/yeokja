parser = "mkdocs"
output = "ko/content/korean/{path}"

[derive]
base = "upstream"

[[derive.overlay]]
path = "ko"

[[derive.overlay]]
path = "overlay"

[[derive.step]]
kind = "generate"
command = 'python3 "$YEOKJA_ROOT/scripts/prepare_site.py" korean .'

# 원문(러시아어)을 같은 Hugo·같은 baseURL로 먼저 빌드해 비교 기준으로 삼고, 번역
# 사이트를 빌드한 뒤 scripts/check_site.py로 쪽 목록·링크·앵커·제목·그림·수식
# 구분자 수를 비교합니다.
[build.html]
command = '''
set -e
python3 "$YEOKJA_ROOT/scripts/scope.py" check
rm -rf "$YEOKJA_ROOT/build/original-source" "$YEOKJA_ROOT/build/original"
cp -RL "$YEOKJA_ROOT/upstream" "$YEOKJA_ROOT/build/original-source"
rm -rf "$YEOKJA_ROOT/build/original-source/.git"
python3 "$YEOKJA_ROOT/scripts/prepare_site.py" russian "$YEOKJA_ROOT/build/original-source"
cp "$YEOKJA_ROOT/scripts/original.yaml" "$YEOKJA_ROOT/build/original-source/original.yaml"
(cd "$YEOKJA_ROOT/build/original-source" && hugo --quiet --gc --minify --config config.yaml,original.yaml --destination "$YEOKJA_ROOT/build/original")
rm -rf site
hugo --gc --minify --destination site
python3 "$YEOKJA_ROOT/scripts/check_site.py" "$YEOKJA_ROOT/build/original" site
'''
outputs = ["site"]

[provider]
type = "claude_code"
model = "claude-opus-5-5"

[evaluation]
auto_evaluate = true
style_evaluate = false
max_retries = 3

[translation]
concurrency = 6
