# 비교용 원문(러시아어) 빌드 설정. upstream/config.yaml 위에 겹쳐 씁니다
# (`hugo --config config.yaml,original.yaml`). 번역 사이트와 같은 baseURL·테마·
# 출력 종류로 맞춰 scripts/check_site.py가 두 빌드를 쪽 단위로 비교합니다.
baseURL: "https://yeokja.moreal.dev/algorithmica/"
canonifyURLs: true
theme: [algorithmica]
defaultContentLanguage: ru
disableLanguages: [en]
disableKinds: [taxonomy, term, RSS]
outputs:
  home: [HTML, SearchIndex]
languages:
  ru:
    baseURL: "https://yeokja.moreal.dev/algorithmica/"
markup:
  goldmark:
    renderHooks:
      link:
        useEmbedded: never
      image:
        useEmbedded: never
