# Algorithmica(러시아어판) 용어집 — 러시아어 → 한국어
#
# 원칙: 한국어 경시 프로그래밍·알고리즘 교재에서 널리 쓰는 용어를 따릅니다.
# 러시아어는 격변화가 있어 용어 검사(단어 경계 일치)가 원형 하나로는 다른 격을
# 놓치므로, 자주 쓰이는 격·수 형태를 모두 같은 번역어의 항목으로 둡니다.
# 'вершина'(정점/꼭짓점), 'ребро'(간선/변), 'поток'(유량/스트림), 'перебор'
# (완전 탐색/순회)처럼 장에 따라 뜻이 갈리는 단어와, 전치사 'до'와 겹치는 약어
# ДО(дерево отрезков)와 НОД(최대공약수이지만 구어 'нод'(노드)와 겹침)는 여기 두지 않고 terms.toml과 모델의 문맥 판단에 맡깁니다.

