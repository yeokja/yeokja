# Rust로 배우는 Chip-8 에뮬레이션 입문 용어집
#
# 번역어는 rustc-dev-guide·rust-api-guidelines 용어집과 맞춥니다(크레이트,
# 구조체, 클로저, 패턴 매칭). 시스템·언어·도구 이름(Chip-8, Super Chip-8,
# XO-Chip, NES, Game Boy, Rust, Cargo, WebAssembly, SDL, wasm-pack)은 원문
# 그대로 둡니다. opcode 표기(00E0, DXYN), 레지스터 이름(V0–VF, VX, VY, I, PC,
# SP, DT, ST), 16진수 리터럴은 용어집 대상이 아니며 원문 글자 그대로 둡니다.

