# nix.dev 용어집
#
# 같은 생태계를 다루는 projects/zero-to-nix/glossary.toml과 표기를 맞춥니다.
# 제품·프로젝트·조직의 고유명사(Nix, Nixpkgs, NixOS, Hydra, Cachix, Home
# Manager, stdenv, nixpkgs-unstable 같은 채널·브랜치 이름)는 영어 그대로 둡니다.
# 한국어 Nix 사용자 커뮤니티와 실제 명령·저장소 이름이 이 표기를 쓰므로
# 번역하면 문서와 도구가 어긋납니다. 이 규칙은 translation 값을 원문과 같게
# 두는 방식으로 표현합니다(yeokja 용어집에는 "번역하지 않음" 필드가 없습니다).
#
# 명령과 하위 명령(`nix-shell`, `nix-build`, `nix develop`, `nixos-rebuild
# switch`), 파일 이름(`default.nix`, `shell.nix`, `configuration.nix`,
# `flake.nix`), Nix 언어의 함수·속성·내장 이름(`derivation`, `mkShell`,
# `callPackage`, `builtins.fetchTarball`, `lib.mkOption`)은 원문의 인라인 코드
# 그대로 두고 절대 번역하지 않습니다. 용어집 매칭은 인라인 코드와 URL 안을
# 건너뛰므로, 아래 항목은 산문에 나온 일반 명사에만 적용됩니다.
#
# `derivation`은 zero-to-nix와 같이 산문에서도 영어 그대로 씁니다. 한국어
# 커뮤니티에 굳어진 역어가 없고, "파생물"처럼 옮기면 Nix 언어의 `derivation`
# 함수와 스토어의 .drv 파일을 가리키는 말이라는 사실이 흐려지기 때문입니다.
#
# 매칭은 대소문자를 무시하고 단어 경계로 끊으므로 복수형과 동사 활용형은
# 별도 항목으로 둡니다.

# ---- 고유명사: 번역하지 않음 ----

