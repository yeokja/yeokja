# 일반 개념.
#
# tensor(텐서), contraction(축약), stream(스트림), packet(패킷), kernel(커널),
# schedule(스케줄)은 일부러 항목으로 두지 않는다. 용어 검사는 대소문자를
# 가리지 않고 단어 단위로 맞추며 더 긴 용어를 우선하지 않으므로, 이 단어들이
# 영문으로 두는 이름(Tensor Unit, Tensor Contraction Processor,
# Contraction Engine, Stream Adapter, Packet Reducer, Kernel Optimizer,
# Schedule Viewer) 안에 나타나면 그 이름 안에서도 한국어 번역을 요구해
# 재시도를 일으키고 "텐서 축약 프로세서(Tensor Contraction Processor)" 같은
# 번역을 만든다(파일럿에서 확인). 번역은 위 괄호 안의 표기를 따른다.
