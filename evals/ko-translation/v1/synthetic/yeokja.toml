# 한국어 번역 eval의 합성 항목(설계 문서 4.2절)을 만드는 미니 프로젝트입니다.
# 실제로 번역하지 않습니다. yeokja-eval이 이 설정의 묶음 규칙으로 요청을 만들고,
# 실행할 때 [provider]는 후보 모델로 덮어씁니다.
[project]
source_lang = "en"
target_lang = "ko"
glossary = "glossary.toml"
state_dir = "state"

[[sources]]
path = "src/md"
pattern = "**/*.md"
parser = "markdown"
inline_tags = true
output = "ko/src/md/{path}"

[[sources]]
path = "src/rst"
pattern = "**/*.rst"
parser = "rst"
output = "ko/src/rst/{path}"

[[sources]]
path = "src/tex"
pattern = "**/*.tex"
parser = "latex"
output = "ko/src/tex/{path}"

# 자리표시자입니다. eval 실행기가 후보별 프로바이더로 바꿉니다.
[provider]
type = "claude_code"
model = "claude-sonnet-5"

[evaluation]
auto_evaluate = true
style_evaluate = false
max_retries = 3

[translation]
concurrency = 8
batch_segments = 32
