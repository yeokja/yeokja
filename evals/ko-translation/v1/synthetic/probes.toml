# 합성 블록별 시험 대상입니다. `block`은 yeokja 파서가 매기는 블록 ID
# (`section:N/block:M`)이고, 그 블록의 세그먼트는 `<block>/seg:K`입니다.
# 원문을 고치면 ID가 바뀔 수 있으므로 v1을 고치지 말고 v2를 만듭니다.
# 여기 없는 번역 대상 블록은 시험 대상이 없는 장 제목뿐입니다. 이 블록들도
# 운영처럼 요청에는 함께 들어갑니다.
#
# probe 어휘
#   reference-link      [text][ref], [ref][], [ref] 참조 링크와 파일 끝 정의
#   bold-span           문장 경계를 넘는 굵게/기울임 (세그먼트 경계에 걸침)
#   gfm-alert           > [!NOTE] 등 경고 표시 (마커는 세그먼트에 없고 원문 줄로 남음)
#   math                인라인 수식이 문장 사이에 섞임
#   math-text           수식 안 \text{...} (식별자를 번역하면 안 됨)
#   long-block          6문장 이상, 잘림·문장 간 내용 이동·"It/This" 지시어
#   glossary-collision  용어집 용어가 백틱 코드 식별자와 겹침
#   claudish-bait       명사화, 수동태 연쇄, "you" 주어, 줄표 삽입구, 수식어 나열
#   noun-heading        명사구 제목
#   inline-mix          code, *기울임*, **굵게**, 링크, 인라인 HTML이 촘촘히 섞임
#   rst-role            :ref:, :func:, :doc:, :term:, ``literal``, `text <url>`_ 등
#   rst-footnote        [#label]_ 각주 참조와 각주 본문
#   latex-command       \emph, \textbf, \cite, \ref, ~ 붙은 참조
#   latex-footnote      \footnote{...}가 세그먼트 안에 통째로 들어 있음
#   latex-aux           \emph/\textbf/\text 인자를 파서가 따로 떼어 낸 보조 블록
#                       (span 없음, 재구성 때 본문 번역 안의 같은 문자열을 치환)
#   baseline            특별한 장치가 없는 대조용 문장

