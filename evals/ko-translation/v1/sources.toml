# eval 세트 v1에 발췌를 허용하는 프로젝트와 그 라이선스.
#
# bucket은 출력 파일(items.<bucket>.jsonl)이고, 한 파일에는 같은 조건의
# 라이선스만 모입니다. root 아래이면서 state가 커밋된 원문 파일만 뽑습니다.
# 여기에 없는 프로젝트(napkin: 본문이 CC BY-SA 4.0이지만 발췌가 GPL-3.0
# LaTeX 소스에서 나옴)는 뽑지 않습니다.

[projects.chisel-book]
bucket = "cc-by-sa-4.0"
license = "CC-BY-SA-4.0"
attribution = "Martin Schoeberl"
root = "upstream"

[projects.cp-algorithms]
bucket = "cc-by-sa-4.0"
license = "CC-BY-SA-4.0"
attribution = "cp-algorithms contributors"
root = "upstream"

[projects.cpython-devguide]
bucket = "permissive"
license = "CC0-1.0"
attribution = "Python Software Foundation and devguide contributors"
root = "upstream"

