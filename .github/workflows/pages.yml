# 번역 프로젝트들을 GitHub Pages로 배포합니다.
#
# 번역은 CI에서 일어나지 않습니다: 커밋된 state/에서 출력을 재구성만 하고
# (완역 상태라 provider 호출이 0회), `status --check`가 미번역 세그먼트를
# 발견하면 영어 문장이 섞인 판을 조용히 배포하는 대신 실패합니다. 이 재구성은
# 그래도 build html 전에 필요합니다: 재구성 결과인 ko/는 gitignore되어 있고,
# assemble은 ko/가 없으면 에러 없이 "빈 오버레이"로 취급해 영어 원본만 있는
# 사이트를 조용히 만들어 버리기 때문입니다.
#
# 잡 구성:
#
#   plan ─▶ rebuild (matrix) ─▶ stage ─▶ deploy
#
# plan: yeokja CLI를 준비하고(Rust 소스가 그대로면 캐시된 바이너리를 그대로
#   씀), 모든 프로젝트의 ko/를 재구성한 뒤, 프로젝트·타깃마다
#   .github/scripts/build-fingerprint.sh로 빌드 입력의 지문을 냅니다. 마지막으로
#   스테이징된 Pages 트리(캐시)에 기록된 지문과 같으면 그 트리에 이미 같은
#   산출물이 있으므로 빌드를 건너뛰고, 다른 것만 rebuild 매트릭스로 내보냅니다.
#   파서 crate가 바뀌어도 그 파서가 만드는 ko/ 내용이 그대로면 지문도 그대로입니다
#   — 판단 기준은 결과물이지 파서 버전이 아닙니다.
#
# rebuild: 지문이 바뀐 프로젝트·타깃만, 각각 필요한 툴체인만 설치해 빌드합니다
#   (PyPy는 Python 2.7+Sphinx, theBeamBook은 Ruby+Asciidoctor, Lean 서적은 elan
#   또는 Python+Sphinx, Napkin은 Nix+LaTeXML, Zero to Nix는 Node+Astro, nix.dev는
#   Python 3+Sphinx와 Pagefind용 Node.js — 러너에 기본 설치됨). 잡은
#   GitHub-hosted 러너에서 병렬로 돕니다.
#
# stage: 마지막으로 스테이징한 Pages 트리를 캐시에서 복원하고(캐시가 없을 때만
#   배포된 사이트를 wget으로 미러링), 새 산출물을 그 위에 덮어쓴 뒤 트리를 다시
#   캐시합니다. 덮어쓴 산출물의 지문은 트리 안의 build-fingerprints/에 함께
#   기록되어 트리와 함께 캐시·배포되므로 둘이 어긋나지 않습니다.
#
# rust-forge는 빌드 중 static.rust-lang.org에서 최신 릴리스 채널 정보를
# 받아오므로 입력이 같아도 결과가 날마다 달라질 수 있어, rebuild_daily로 하루에
# 한 번은 지문에 날짜를 섞어 다시 빌드합니다. pypy-eu-reports는 state/가 통째로
# gitignore(라이선스 미확정, README 참조)라 커밋된 상태가 없고 [build.html]
# 타깃도 없어 CI에서 할 일이 없으므로 목록에서 뺍니다.
#
# 새 배포 프로젝트나 타깃을 추가하면 .github/pages-projects.json과 stage 잡이
# 부르는 .github/scripts/stage-pages.sh에 각각 항목을 추가해야 합니다. 새
# 툴체인이 필요하면 아래 rebuild 잡에 설치 스텝도 추가합니다. 전체를 강제로
# 다시 빌드하려면 workflow_dispatch의 force_rebuild를 켭니다.
name: Deploy Pages

# main push와 수동 실행에서만 배포합니다. pull_request 검증은 pr.yml에서 따로
# 합니다.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 지문 게이트를 무시하고 모든 프로젝트를 다시 빌드합니다
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      site_key: ${{ steps.site.outputs.cache-matched-key }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Rust 소스와 Cargo.lock이 그대로면 바이너리도 그대로이므로, 툴체인 설치와
      # 빌드를 통째로 건너뜁니다.
      - name: Restore the yeokja binary
        id: cli
        uses: actions/cache@v4
        with:
          path: target/release/yeokja
          key: yeokja-cli-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**') }}

      - name: Install Rust
        if: steps.cli.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        if: steps.cli.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2

      - name: Build yeokja
        if: steps.cli.outputs.cache-hit != 'true'
        run: cargo build --release -p yeokja-cli

      - name: Upload yeokja binary
        uses: actions/upload-artifact@v4
        with:
          name: yeokja-cli
          path: target/release/yeokja
          retention-days: 1

      # 지문은 upstream HEAD와 재구성된 ko/ 내용을 읽으므로 모든 프로젝트의
      # upstream이 필요합니다. 히스토리는 필요 없으니 얕게 받습니다.
      - name: Fetch every project's submodule
        run: git submodule update --init --depth 1 --jobs 4

      - name: Rebuild translated sources from committed state
        run: |
          for p in $(jq -r '.[].project' .github/pages-projects.json | sort -u); do
            echo "::group::$p"
            .github/scripts/rebuild-translations.sh "$p"
            echo "::endgroup::"
          done

      # 마지막으로 스테이징된 트리를 복원해 기록된 지문을 읽습니다. 캐시가
      # 없으면(첫 실행, 만료) 기록도 없으니 모두 다시 빌드합니다. stage 잡은
      # 여기서 찾은 것과 정확히 같은 캐시 항목을 복원해, 판단의 근거가 된
      # 트리 위에 산출물을 덮어씁니다.
      - name: Restore the last staged Pages tree
        id: site
        uses: actions/cache/restore@v4
        with:
          path: _site
          key: pages-site-${{ github.run_id }}
          restore-keys: pages-site-

      - name: Plan which projects to rebuild
        id: plan
        run: |
          args=(.github/pages-projects.json _site/build-fingerprints plan-fingerprints)
          if [ "${{ inputs.force_rebuild }}" = "true" ]; then
            args+=(--force)
          fi
          matrix=$(.github/scripts/plan-rebuilds.sh "${args[@]}")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix" | jq .

      # 이번 실행에서 계산한 지문 전부. stage 잡은 실제로 덮어쓴 산출물의
      # 지문만 이 중에서 골라 트리에 기록합니다.
      - name: Upload build fingerprints
        uses: actions/upload-artifact@v4
        with:
          name: plan-fingerprints
          path: plan-fingerprints
          retention-days: 1

  rebuild:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    continue-on-error: ${{ matrix.project != 'devguide' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 이 잡이 다루는 프로젝트의 submodule만 받습니다 — 다른 프로젝트의
      # upstream(수백 MB)까지 받을 이유가 없습니다.
      - name: Fetch this project's submodule
        run: git submodule update --init --depth 1 projects/${{ matrix.project }}/upstream

      # contributors 표가 git 히스토리 전체를 요구합니다. actions/checkout이
      # submodule을 얕게 받았을 때만 --unshallow가 의미가 있고, 아니면 no-op.
      - name: Unshallow this project's submodule for the contributors table
        if: matrix.unshallow
        run: git -C projects/${{ matrix.project }}/upstream fetch --unshallow || true

      - name: Download yeokja binary
        uses: actions/download-artifact@v4
        with:
          name: yeokja-cli
          path: target/release

      - name: Make yeokja executable
        run: chmod +x target/release/yeokja

      - name: Rebuild translated sources from committed state
        run: .github/scripts/rebuild-translations.sh ${{ matrix.project }}

      # PyPy 문서의 conf.py는 py2 문법인 pypy.config를 임포트하므로 공식
      # 환경(.readthedocs.yaml)과 같은 Python 2.7이 필요합니다.
      - name: Install Python 2.7 for the PyPy docs
        if: matrix.toolchain == 'python2'
        uses: actions/setup-python@v5
        with:
          python-version: 'pypy2.7'

      - name: Install the PyPy docs Sphinx toolchain
        if: matrix.toolchain == 'python2'
        run: pip install 'sphinx<2' 'docutils==0.11' 'sphinx-issues==1.2.0' 'sphinx_rtd_theme<1' py sphinx-affiliates

      - name: Install Python 3
        if: matrix.toolchain == 'python3-devguide' || matrix.toolchain == 'python3-mil' || matrix.toolchain == 'python3-peps' || matrix.toolchain == 'python3-nix-dev'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv for the Python devguide
        if: matrix.toolchain == 'python3-devguide'
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install the Mathematics in Lean Sphinx toolchain
        if: matrix.toolchain == 'python3-mil'
        run: pip install -r projects/${{ matrix.project }}/upstream/scripts/requirements.txt

      - name: Install the PEPs Sphinx toolchain
        if: matrix.toolchain == 'python3-peps'
        run: pip install -r projects/${{ matrix.project }}/upstream/requirements.txt

      # 빌드 스크립트는 GITHUB_ACTIONS가 켜져 있으면 venv를 만들지 않고 여기서
      # 설치한 툴체인을 씁니다. Pagefind는 러너의 Node.js로 npx가 받습니다.
      - name: Install the nix.dev Sphinx toolchain
        if: matrix.toolchain == 'python3-nix-dev'
        run: pip install -r projects/${{ matrix.project }}/requirements.txt

      - name: Install Ruby
        if: matrix.toolchain == 'ruby'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install the Asciidoctor toolchain
        if: matrix.toolchain == 'ruby'
        run: gem install asciidoctor asciidoctor-diagram rouge

      - name: Install XeLaTeX for the Chisel book
        if: matrix.toolchain == 'latex-chisel'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fonts-dejavu-core fonts-nanum \
            texlive-bibtex-extra texlive-fonts-recommended texlive-lang-korean \
            texlive-latex-extra texlive-xetex

      - name: Install Nix for the Napkin build
        if: matrix.toolchain == 'nix'
        uses: cachix/install-nix-action@v31

      # Napkin 빌드가 매번 cache.nixos.org에서 수천 개의 스토어 경로(scheme-full
      # TeX Live 포함)를 받아 오던 것을 Actions 캐시로 대체합니다. html·epub은
      # assets/의 플레이크를, pdf는 upstream의 플레이크를 쓰므로 스토어 캐시도
      # nix_store 값으로 둘로 나눕니다 — 한 키를 같이 쓰면 먼저 저장된 쪽의
      # 부분집합만 남아 다른 쪽은 매번 다시 받게 됩니다. 키는 flake.lock의
      # 해시라 입력이 바뀔 때만 새 항목이 생기고, 그때 같은 접두사의 옛 항목은
      # purge로 지워 저장소 캐시 한도(10 GB)를 아낍니다. `nix develop`은 GC
      # 루트를 남기지 않아 저장 전 GC를 걸면 방금 받은 경로가 지워지므로
      # gc-max-store-size는 두지 않습니다.
      - name: Cache the Nix store for the Napkin build
        if: matrix.toolchain == 'nix'
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ matrix.nix_store }}-${{ hashFiles('projects/napkin/assets/flake.lock', 'projects/napkin/upstream/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ matrix.nix_store }}-
          purge: true
          purge-prefixes: nix-${{ runner.os }}-${{ matrix.nix_store }}-
          purge-created: 0
          purge-primary-key: never

      # Sphinx의 graphviz 확장과 asciidoctor-diagram 둘 다 다이어그램을
      # 렌더링하려면 dot 바이너리가 있어야 합니다. 없으면 빌드가 실패하는 대신
      # 경고만 남기고 다이어그램 원본 텍스트를 그대로 페이지에 삽입해버려서,
      # 깨진 결과물이 조용히 배포되는 문제가 있었습니다.
      #
      # 번역된 다이어그램은 노드 라벨이 한글이라 dot이 PNG로 래스터라이즈할 때
      # (RPython translation.rst의 digraph처럼) CI 러너에 한글 글리프가 있는
      # 폰트가 없으면 글자가 네모(tofu)로 깨져서 그대로 이미지에 구워집니다.
      # fonts-noto-cjk를 같이 깔아야 fontconfig가 Sans-Serif 요청을 한글이
      # 있는 폰트로 대체합니다.
      - name: Install Graphviz
        if: matrix.toolchain == 'python2' || matrix.toolchain == 'ruby'
        run: sudo apt-get update && sudo apt-get install -y graphviz fonts-noto-cjk

      # FP in Lean은 빌드 중 Python 출력을 책에 포함하므로 upstream CI와 같은
      # 버전을 사용합니다. 같은 Lean 잡인 TPiL에도 일관된 Python을 제공합니다.
      - name: Install Python for the Lean books
        if: matrix.toolchain == 'lean'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.4'

      # upstream Lean 책 CI와 같은 방식으로 elan을 설치합니다. book과 examples는
      # 서로 다른 lean-toolchain을 가지며, 첫 lean 호출이 각각을 설치합니다.
      # rust-forge의 mdbook 전처리기(blacksmith)는 cargo로 빌드되고, 릴리스
      # 채널 테이블을 채우려면 static.rust-lang.org에서 최신 stable/beta/nightly
      # 정보를 가져와야 하므로(RUN_BLACKSMITH=1) 네트워크 접근이 필요합니다.
      - name: Install Rust for rust-forge's blacksmith preprocessor
        if: matrix.toolchain == 'rust-forge'
        uses: dtolnay/rust-toolchain@stable

      - name: Install mdbook for rust-forge
        if: matrix.toolchain == 'rust-forge'
        run: |
          MDBOOK_VERSION=0.5.4
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Install Rust for rustc-dev-guide
        if: matrix.toolchain == 'rustc-dev-guide'
        uses: dtolnay/rust-toolchain@stable

      - name: Install rustc-dev-guide mdBook tools
        if: matrix.toolchain == 'rustc-dev-guide'
        run: |
          cargo install --locked mdbook --version 0.5.2
          cargo install --locked mdbook-mermaid --version 0.17.0

      # Zero to Nix는 Astro 사이트라 Node가 필요합니다. upstream의 lockfile을
      # 키로 npm 캐시를 유지해 `npm ci`가 매번 레지스트리를 다 받지 않게 합니다.
      - name: Install Node for the Zero to Nix Astro build
        if: matrix.toolchain == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: projects/${{ matrix.project }}/upstream/package-lock.json

      - name: Install elan for the Lean books
        if: matrix.toolchain == 'lean'
        run: |
          curl -O --location https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh
          chmod u+x elan-init.sh
          ./elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install the Lean book toolchains
        if: matrix.toolchain == 'lean'
        run: |
          (cd projects/${{ matrix.project }}/upstream/examples && lean --version)
          (cd projects/${{ matrix.project }}/upstream/book && lean --version)

      - name: Build ${{ matrix.target }}
        run: |
          cd projects/${{ matrix.project }}
          ../../target/release/yeokja build ${{ matrix.target }}

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}
          retention-days: 1

  stage:
    needs: [plan, rebuild]
    # rebuild는 다시 빌드할 것이 없으면 통째로 건너뛰므로 skipped도 정상입니다.
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.rebuild.result == 'success' || needs.rebuild.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # plan 잡이 지문을 비교한 바로 그 트리를 복원합니다. 캐시 항목이 그 사이
      # 사라졌으면 배포된 사이트를 미러링하는 예전 방식으로 돌아갑니다(몇 분
      # 걸리지만 첫 실행이나 캐시 만료 때만 일어납니다).
      - name: Restore the last staged Pages tree
        id: site
        if: needs.plan.outputs.site_key != ''
        uses: actions/cache/restore@v4
        with:
          path: _site
          key: ${{ needs.plan.outputs.site_key }}

      # 미러링 주소와 경로 깊이를 알기 위해 미러링보다 먼저 둡니다. 저장소를
      # 다른 계정으로 옮기거나 커스텀 도메인을 붙여도 여기서 나오는 base_url과
      # base_path가 그에 맞게 바뀝니다.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # 사이트가 https://<host>/<base_path>/ 아래에 있으면 wget이 만드는 경로에서
      # base_path의 디렉터리 수만큼 잘라내야 _site가 사이트 루트가 됩니다.
      # 커스텀 도메인처럼 base_path가 비어 있으면 자를 것이 없습니다.
      - name: Mirror the currently deployed Pages tree
        if: steps.site.outputs.cache-hit != 'true'
        run: |
          rm -rf _site
          mkdir -p _site
          base_url='${{ steps.pages.outputs.base_url }}'
          base_path='${{ steps.pages.outputs.base_path }}'
          depth=$(printf '%s' "$base_path" | tr -cd '/' | wc -c | tr -d ' ')
          wget --mirror --no-host-directories --cut-dirs="$depth" --no-parent \
            --directory-prefix=_site "${base_url%/}/" || true
          test -s _site/index.html

      - name: Download built sites
        if: needs.rebuild.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: artifacts

      - name: Download build fingerprints
        uses: actions/download-artifact@v4
        with:
          name: plan-fingerprints
          path: artifacts/plan-fingerprints

      - name: Stage the Pages tree
        run: |
          mkdir -p artifacts
          .github/scripts/stage-pages.sh artifacts _site site artifacts/plan-fingerprints

      # 내용이 같은 트리는 같은 키로 접혀 캐시 항목이 늘지 않습니다. 트리
      # 안의 build-fingerprints/도 해시에 들어가므로 지문 기록과 트리는 언제나
      # 한 항목으로 묶입니다.
      - name: Save the staged Pages tree
        uses: actions/cache/save@v4
        with:
          path: _site
          key: pages-site-${{ hashFiles('_site/**') }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: stage
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
