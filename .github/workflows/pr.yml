name: Pull Request CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test workspace
        run: cargo test --workspace

      - name: Test the Pages deployment scripts
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Test rustc-dev-guide heading anchors
        run: python3 -m unittest discover -s projects/rustc-dev-guide/scripts -p 'test_*.py'

      - name: Test furiosa-opt heading anchors, footer and alert markers
        run: python3 -m unittest discover -s projects/furiosa-opt/scripts -p 'test_*.py'

      # ko_anchors 훅 테스트는 Python-Markdown이 필요하므로 격리된 venv에 설치합니다.
      - name: Test cp-algorithms site preparation and heading anchors
        run: |
          python3 -m venv "$RUNNER_TEMP/cp-algorithms-venv"
          "$RUNNER_TEMP/cp-algorithms-venv/bin/pip" install --quiet markdown
          "$RUNNER_TEMP/cp-algorithms-venv/bin/python" -m unittest discover -s projects/cp-algorithms/scripts -p 'test_*.py'

      - name: Test HoTT PDF preparation and index localization
        run: python3 -m unittest discover -s projects/hott/scripts -p 'test_*.py'

      - name: Fetch the Ray Tracing test corpus
        run: git submodule update --init --depth 1 projects/raytracing/upstream

      - name: Test Ray Tracing translation and build checks
        run: python3 -m unittest discover -s projects/raytracing/scripts -p 'test_*.py'
