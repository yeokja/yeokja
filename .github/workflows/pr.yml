name: Pull Request CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test workspace
        run: cargo test --workspace

      - name: Test the Pages deployment scripts
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Test rustc-dev-guide heading anchors
        run: python3 -m unittest discover -s projects/rustc-dev-guide/scripts -p 'test_*.py'

      - name: Test HoTT PDF preparation and index localization
        run: python3 -m unittest discover -s projects/hott/scripts -p 'test_*.py'
