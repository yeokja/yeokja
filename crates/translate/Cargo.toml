[package]
name = "yeokja-translate"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
yeokja-core = { path = "../core" }
yeokja-parser-rst = { path = "../parser-rst" }
yeokja-parser-mkdocs = { path = "../parser-mkdocs" }
pulldown-cmark = { version = "0.12", default-features = false }
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
glob = "0.3"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
toml = "0.8"

[dev-dependencies]
yeokja-parsers = { path = "../parsers" }
pulldown-cmark = "0.12"
